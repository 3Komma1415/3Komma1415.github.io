{{ define "main" }}
<div class="landing-page-wrapper">
  <div class="landing-page-content">
    <div>
      {{ .Content | safeHTML }}
    </div>
  </div>

  <div class="landing-page-image">
    <img src="{{ .Params.image | absURL }}"
         alt="{{ .Site.Params.person.name | default .Site.Title }}, {{ .Site.Params.person.job_title }} at the {{ .Site.Params.person.department }}"
         width="221" height="331" fetchpriority="high">
  </div>
</div>

<!-- Full-width publications below text+image -->
<div class="landing-page-publications">
  {{ partial "publications.html" . }}
</div>
{{ end }}
