
# Global options
baseURL = "https://www.julian-thomas-thomas.de"
relativeURLs = false
canonifyURLs = false
copyright = "© 2025 by Julian Thomas Thomas. <a href='/imprint'>Imprint</a>."
defaultContentLanguage = "en"
disableKinds = ["taxonomy"]
enableRobotsTXT = true
languageCode = "en"
theme = "barks"
title = "Julian Thomas"

[sitemap]
    changefreq = "monthly"
    priority = 0.5



# Main menu
[[menu.main]]
    name = "About"
    url  = "/about"
    weight = 2
[[menu.main]]
    name = "Publications"
    url  = "/publications"
    weight = 2
[[menu.main]]
    name = "Talks"
    url  = "/talks"
    weight = 2
[[menu.main]]
    name = "Teaching"
    url  = "/teaching"
    weight = 2

[[menu.main]]
    name = "CV"
    url  = "/cv"
    weight = 3

# Customization options
[params]

    [params.head]
        author = "Julian Thomas"
        custom_css = "/custom.css"
        # Shown as the Google result snippet for the home page (~155 characters)
        description = "Julian Thomas is a PhD candidate at the Chair of Applied Cryptography, FAU Erlangen-Nürnberg, working on formal methods and provable security."
        # Appended to the site title in the <title> of the home page
        tagline = "PhD Candidate in Applied Cryptography, FAU Erlangen-Nürnberg"
        # Preview image used for Open Graph / Twitter cards
        image = "/avatar.jpg"
        keywords = ["cryptography", "security", "FAU"]

    # Used for the schema.org Person markup in partials/schema.html
    [params.person]
        name = "Julian Thomas"
        alternate_name = "Julian Thomas Thomas"
        given_name = "Julian"
        family_name = "Thomas"
        job_title = "PhD Candidate"
        email = "julian.thomas@fau.de"
        affiliation = "Friedrich-Alexander-Universität Erlangen-Nürnberg"
        affiliation_url = "https://www.fau.eu"
        department = "Chair of Applied Cryptography"
        department_url = "https://www.chaac.tf.fau.de"
        knows_about = [
            "Cryptography",
            "Applied Cryptography",
            "Provable Security",
            "Formal Methods",
            "Cryptographic Protocols",
            "IT Security",
        ]
        # Every profile that belongs to the same person. Google uses these to
        # connect the site with the person behind it — add new ones here.
        same_as = [
            "https://www.chaac.tf.fau.de/person/julian-thomas/",
            "https://scholar.google.com/citations?user=qCPdTnoAAAAJ",
            "https://github.com/3Komma1415",
            # "https://orcid.org/0000-0000-0000-0000",
            # "https://dblp.org/pid/XXX/XXXXX.html",
            # "https://www.linkedin.com/in/...",
        ]

    [params.navigation]
        show_navigation = true

    [params.footer]
        show_footer = true

    [params.typography]
#        title_font = "Urbanist"
        title_font = "Cutive Mono"
        body_font = "Source Sans Pro"

    [params.colors]
        theme_color = "#333333"
        background_color = "#fcfbf9"
        text_color = "#333333"
        link_color = "#800080"


    [params.social.github]
        name = "GitHub"
        class = "fab fa-github"
        url = "https://github.com/3Komma1415"
        weight = 2
    [params.social.google_scholar]
        name = "Google Scholar"
        class = "ai ai-google-scholar-square"
        url = "https://scholar.google.com/citations?user=qCPdTnoAAAAJ&hl=de&authuser=2"
        weight = 3
    [params.social.institution]
        name = "My institution"
        class = "fas fa-university"
        url = "https://www.chaac.tf.fau.de"
        weight = 5



# Options for Markdown renderer
[markup]

    [markup.goldmark.renderer]
        unsafe = true
        xHTML = true

    [markup.highlight]
        style = 'dracula'
